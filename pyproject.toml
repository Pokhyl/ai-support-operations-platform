[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-operations-platform"
version = "0.1.0"
description = "Production-style AI support operations platform"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
